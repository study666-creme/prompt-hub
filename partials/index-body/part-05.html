  <div class="edit-panel hidden" id="editPanel">
    <div class="panel-header">
      <h4 id="panelTitle">新建卡片</h4>
      <div class="panel-header-actions">
        <button type="button" class="btn btn-ghost btn-sm panel-pin-btn hidden" id="cardPinToggle" onclick="toggleCardPin()" title="置顶">置顶</button>
        <button type="button" class="btn btn-ghost btn-sm mobile-only panel-header-clear-btn" id="actionDeleteClearBtnMobileTop" title="清空表单" aria-label="清空">清空</button>
        <button class="close-btn desktop-only" onclick="closeEditPanel()">✕</button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="image-drop-area no-image" id="dropArea">
        <span class="placeholder-text" id="dropPlaceholder">点击、拖拽或 Ctrl+V 粘贴图片（可多选，最多 5 张同卡）</span>
        <img id="previewImage" style="display:none;">
        <button type="button" class="remove-image-btn" id="removeImageBtn" onclick="event.stopPropagation(); removeImage()" title="从编辑区去掉图片（须保存后才真正删除）" aria-label="去掉图片"><span aria-hidden="true">×</span></button>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
      </div>
      <div class="panel-gallery-nav hidden" id="panelGalleryNav" aria-label="卡片多图切换">
        <button type="button" class="panel-gallery-nav-btn" id="panelGalleryPrev" aria-label="上一张">‹</button>
        <span class="panel-gallery-nav-counter" id="panelGalleryCounter">1 / 1</span>
        <button type="button" class="panel-gallery-nav-btn" id="panelGalleryNext" aria-label="下一张">›</button>
      </div>
      <div class="panel-image-tools" id="panelImageTools">
        <button type="button" class="panel-image-tool-btn panel-image-tool-toggle" id="cardUploadOriginalToggle" aria-pressed="false">上传原图：关</button>
        <button type="button" class="panel-image-tool-btn" id="panelAddImageBtn" title="同一张卡片最多 5 张图">添加图片</button>
        <button type="button" class="panel-image-tool-btn hidden" id="cardDownloadImageBtn">下载当前图</button>
        <button type="button" class="panel-image-tool-btn hidden" id="trimBlackBorderBtn" onclick="trimPanelImageBlackBorder()">裁除黑边</button>
      </div>
      <div class="panel-ocr-drop hidden" id="panelOcrDrop" aria-label="文字识别专用图片框">
        <div class="panel-ocr-drop-inner" id="panelOcrDropInner">
          <span class="panel-ocr-drop-hint" id="panelOcrDropHint">拖入或点击，仅识别文字（不保存图片）</span>
          <span class="panel-ocr-drop-status hidden" id="panelOcrDropStatus">识别中…</span>
        </div>
        <input type="file" id="panelOcrFileInput" accept="image/*" hidden>
      </div>
      <div class="panel-form">
        <label>标题</label>
        <input type="text" id="cardTitle">
        <div class="prompt-field">
          <div class="prompt-field-bar">
            <label class="prompt-label-text" for="cardPrompt">提示词<span class="required-mark">*</span></label>
            <div class="prompt-field-actions">
              <button type="button" class="prompt-header-copy" onclick="copyPromptFromPanel()" title="复制提示词">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button type="button" class="prompt-header-copy" onclick="fillPromptToImageGenFromPanel()" title="填入生图">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              </button>
              <button type="button" class="fp-toggle-btn" id="fpToggleBtn" onclick="toggleFloatingPrompt()" title="浮动提示词框" aria-label="浮动提示词框">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              </button>
            </div>
          </div>
          <textarea id="cardPrompt" oninput="if(!floatingPromptActive) document.getElementById('floatingPromptText').value = this.value"></textarea>
        </div>
        <label>标签</label>
        <div class="tag-input-area" id="tagContainer">
          <div class="tag-chips-wrap" id="tagChipsWrap"></div>
          <input type="text" class="tag-input" id="tagInput" placeholder="输入后回车">
          <div class="tag-pick-wrap">
            <button type="button" class="btn btn-secondary tag-pick-btn" id="tagPickBtn" aria-expanded="false" aria-controls="tagInlinePicker">选择标签</button>
            <div class="tag-inline-picker" id="tagInlinePicker" hidden>
              <div class="tag-inline-list" id="tagInlineList"></div>
            </div>
          </div>
        </div>
        <div id="customFieldsContainer"></div>
        <div class="panel-publish-row" id="panelCommunityPublish">
          <div class="panel-publish-copy">
            <span class="panel-publish-title">发布到提示词社区</span>
            <p class="panel-hint">须先保存到卡片库；提示词≥15字且需配图才会公开。未达标也可正常保存，只是不会发布。关闭开关或删除卡片将从社区下架</p>
          </div>
          <button type="button" class="publish-circle-btn" id="cardPublishToggle" aria-pressed="false" aria-label="发布到提示词社区" title="切换发布"></button>
        </div>
      </div>
    </div>
    <div class="panel-footer">
      <div class="panel-save-progress hidden" id="panelSaveProgress" aria-live="polite">
        <div class="panel-save-progress-track">
          <div class="panel-save-progress-fill" id="panelSaveProgressFill"></div>
        </div>
        <span class="panel-save-progress-label" id="panelSaveProgressLabel">保存中…</span>
      </div>
      <button type="button" class="btn btn-primary btn-footer-save" onclick="saveCard()">保存</button>
      <button type="button" class="btn btn-ghost btn-footer-copy" onclick="copyPromptFromPanel()">复制</button>
      <button type="button" class="btn-icon-danger desktop-only" id="actionDeleteClearBtn" title="删除"></button>
      <button type="button" class="close-btn panel-close-mobile mobile-only" onclick="closeEditPanel()" title="关闭" aria-label="关闭">✕</button>
      <span class="status-message" id="statusMsg"></span>
    </div>
  </div>

  <button type="button" class="fab-new visible" id="fabNewBtn" onclick="createNewCard()" aria-label="新建卡片">
    <svg class="fab-new__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.35" stroke-linecap="round"/>
    </svg>
  </button>
  <button type="button" class="back-to-top" id="backToTopBtn" aria-label="回到顶部" title="回到顶部" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
    </div>
