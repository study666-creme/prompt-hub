      var explicitClear = query.get('clear-cache') === '1';
      var reloadScheduled = false;
      function purgeCachesAndSw() {
        var tasks = [];
        if ('caches' in window) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              if (/prompt-hub-v/i.test(k)) return caches.delete(k);
            }));
          }));
        }
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        return Promise.all(tasks);

      // Expose the cleanup hook to the partial loader so a stale local
      // service worker cannot leave the page with an empty black body.
      window.__PROMPT_HUB_PURGE_CACHES__ = purgeCachesAndSw;

        var onceKey = 'promptrepo_boot_recovery_once_' + recoveryRevision;
        var alreadyRetried = false;
        try { alreadyRetried = sessionStorage.getItem(onceKey) === '1'; } catch (e) { /* ignore */ }

          retryUrl.searchParams.delete('clear-cache');
          if (!reloadScheduled) {
            reloadScheduled = true;
            purgeCachesAndSw().finally(function () { window.location.replace(retryUrl.href); });
          }

        try {
          document.documentElement.style.background = '#101114';
          document.body.innerHTML = '';
          var box = document.createElement('main');
          box.setAttribute('role', 'alert');

          box.querySelector('button').addEventListener('click', function () { window.location.reload(); });
          document.body.appendChild(box);
        } catch (e) { /* keep the recovery path best-effort */ }
      };

      // The local preview no longer installs a service worker. If an older
      // build still controls localhost, clear it once before attempting to
      // assemble the split body. `?clear-cache=1` provides an explicit escape
      // hatch for a browser profile that has retained an unusual cache entry.
      if (explicitClear || (localHost && navigator.serviceWorker && navigator.serviceWorker.controller)) {
        var localOnceKey = 'promptrepo_local_cleanup_once_' + recoveryRevision;
        var localAlreadyRetried = !explicitClear;
        try {
          if (!explicitClear) localAlreadyRetried = sessionStorage.getItem(localOnceKey) === '1';
        } catch (e) { /* ignore */ }
        if (!localAlreadyRetried) {
          try { sessionStorage.setItem(localOnceKey, '1'); } catch (e) { /* ignore */ }
          window.__PROMPT_HUB_BOOT_RECOVERING__ = true;
          var localRetryUrl = new URL(window.location.href);
          localRetryUrl.searchParams.delete('clear-cache');
          if (!reloadScheduled) {
            reloadScheduled = true;
            purgeCachesAndSw().finally(function () { window.location.replace(localRetryUrl.href); });
          }
        }
      }
      if (prev && prev !== cur) {
        localStorage.setItem(key, cur);
        try { localStorage.removeItem('ph_missing_paths_v1'); } catch (e) { /* ignore */ }
        var onceKey = 'promptrepo_build_reload_once_' + cur;
        if (sessionStorage.getItem(onceKey)) return;
        sessionStorage.setItem(onceKey, '1');
        if (!reloadScheduled) {
          reloadScheduled = true;
          purgeCachesAndSw().finally(function () { location.reload(); });
        }
        return;
      }
      if (!prev) localStorage.setItem(key, cur);
    })();

  <script>
    window.__PROMPT_HUB_INDEX_BODY_PARTIAL__ = true;
    (function () {
      var parts = [
        "partials/index-body/part-01.html",
        "partials/index-body/part-02.html",
        "partials/index-body/part-03.html",
        "partials/index-body/part-04.html",
        "partials/index-body/part-05.html"
      ];
      var version = encodeURIComponent(window.__APP_BUILD__ || 'dev');
      var html = '';
      try {
        for (var i = 0; i < parts.length; i += 1) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', parts[i] + '?v=' + version, false);
          xhr.send(null);
          var responseText = xhr.responseText || '';
          var statusOk = (xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && responseText);
          // A legacy service worker may answer a partial request with the
          // cached full index document. Treat that as a boot failure so the
          // recovery hook can unregister it and retry instead of rendering a
          // blank page.
          var looksLikeDocument = /<!doctype\s+html|<html[\s>]/i.test(responseText);
          if (!statusOk || !responseText || looksLikeDocument) {
            throw new Error('Prompt Hub index body partial failed to load: ' + parts[i] + ' (' + xhr.status + ')');
          }
          html += responseText;
        }
        var script = document.currentScript;
        if (script && script.parentNode) {
          script.insertAdjacentHTML('beforebegin', html);
          script.parentNode.removeChild(script);
        } else {
          document.body.insertAdjacentHTML('afterbegin', html);
        }
      } catch (error) {
        if (typeof window.__PROMPT_HUB_BOOT_RECOVERY__ === 'function') {
          window.__PROMPT_HUB_BOOT_RECOVERY__(error);
        } else {
          document.body.innerHTML = '<main style="padding:32px;color:#f4f5f7;background:#101114;font:16px system-ui">卡藏页面加载失败，请刷新重试。</main>';

  <script>
    (function () {
      var FALLBACK = [
        { id: 'image2-economy', label: '全能模型2 · 特价 1K' },
        { id: 'image2-pro', label: '全能模型2 · 稳定 1K/2K/4K' },
        { id: 'image2-A', label: '全能模型2-A' },
        { id: 'lingtu-pro', label: '香蕉 · Pro 1K/2K/4K' },
        { id: 'lingtu-2', label: '香蕉 · 2 1K/2K/4K' },
        { id: 'sensenova-1.5-一秒出图', label: '一秒出图' },
        { id: 'seedream-5.0', label: 'Seedream 5.0 Pro 1K/2K' },
        { id: 'mj-v82', label: 'Midjourney 8.2' },
        { id: 'mj-v81', label: 'Midjourney 8.1' },
        { id: 'mj-v7', label: 'Midjourney 7' },
        { id: 'mj-niji7', label: 'Midjourney Niji 7' }
      ];
      function isRetired(model) {
        return model && model.id === 'image2-free';
      }
      function paint(sel, models) {
        if (!sel || !models || !models.length) return;
        sel.disabled = false;
        sel.removeAttribute('aria-busy');
        sel.innerHTML = '';
        models.forEach(function (m) {
          var opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.id === 'image2-4k-fast'
            ? '全能模型2 · 4K'
            : (m.label || m.catalogLabel || m.id);
          sel.appendChild(opt);
        });
      }
      function readCache() {
        try {
          var raw = JSON.parse(localStorage.getItem('promptrepo_imagegen_models_cache_v4') || 'null');
          if (!raw || !raw.models || !raw.models.length) return null;
          if (raw.ts < Date.now() - 86400000) return null;
          if (Number(raw.version) < 20) return null;
          var models = raw.models.filter(function (model) {
            return model && !isRetired(model);
          });
          return models.length ? models : null;
        } catch (e) { return null; }
      }
      document.addEventListener('DOMContentLoaded', function () {
        var sel = document.getElementById('imageGenModel');
        if (!sel) return;
        var models = (readCache() || FALLBACK).filter(function (model) {
          return model && !isRetired(model);
        });
        paint(sel, models);
      });
    })();
  </script>
